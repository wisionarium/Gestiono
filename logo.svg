<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c8eff" />
      <stop offset="45%" stop-color="#146be6" />
      <stop offset="100%" stop-color="#024bbd" />
    </linearGradient>
    <linearGradient id="logoHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#023b96" flood-opacity="0.38" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="110" ry="110" fill="url(#logoBg)" filter="url(#shadow)" />
  <rect x="24" y="24" width="464" height="464" rx="110" ry="110" fill="url(#logoHighlight)" />
  <rect x="24" y="24" width="464" height="464" rx="110" ry="110" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.35" />

  <!-- Logo Graphic Mark (G + Checkmark) -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer G Circle Ring -->
    <path d="M 335 145 C 302 114 256 100 210 110 C 130 128 75 200 80 282 C 85 365 155 428 238 428 C 322 428 392 362 396 278 C 397 252 388 225 372 202" stroke-width="46" />
    <!-- Inner Checkmark Symbol -->
    <path d="M 195 260 L 260 325 L 372 202" stroke-width="46" />
  </g>
</svg>
